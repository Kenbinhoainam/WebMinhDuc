name: Unchanged hero regression checks
on:
  push:
    branches: [qa/s2-hero-unchanged-20261127]
permissions:
  contents: read
jobs:
  hero:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git merge-base --is-ancestor c83bd9001cf2629dfb1934515fcf1c05ae553910 HEAD
          git diff --exit-code c83bd9001cf2629dfb1934515fcf1c05ae553910 HEAD -- . ':(exclude).github/**'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          set -o pipefail
          node tests/hero-lifecycle.mjs 2>&1 | tee "$RUNNER_TEMP/hero-lifecycle.log"
      - if: always()
        run: |
          set -o pipefail
          npm run test:hero 2>&1 | tee "$RUNNER_TEMP/hero-suite.log"
      - name: Verify established Pages regression commands
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/regression"
          failed=0
          for target in test test:sprint test:catalog test:seo test:hydration test:review test:header test:reference test:sitemap test:flagship audit:i18n; do
            if npm run "$target" >"$RUNNER_TEMP/regression/${target//:/-}.log" 2>&1; then
              echo "$target PASS" | tee -a "$RUNNER_TEMP/regression/summary.log"
            else
              echo "$target FAIL" | tee -a "$RUNNER_TEMP/regression/summary.log"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-regression-logs
          path: ${{ runner.temp }}/regression/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-hero-logs
          path: ${{ runner.temp }}/hero-*.log
