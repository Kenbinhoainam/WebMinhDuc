name: Sprint 2 packaged browser QA
on:
  push:
    branches: [qa/s2-approved-artifact-20261127]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          MINHDUC_PREVIEW_ORIGIN: https://minhduc-sprint2-approved-review.kenbinhoainam.chatgpt.site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - name: Validate static responses, layout and mock journeys
        env:
          QA_OUTPUT: ${{ runner.temp }}/minhduc-browser-results
        run: python tests/s2-pr-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint2-browser-evidence
          path: ${{ runner.temp }}/minhduc-browser-results/
          retention-days: 7
