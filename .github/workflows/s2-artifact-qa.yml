name: Sprint 2 packaged browser QA
on:
  push:
    branches: [qa/s2-approved-artifact-20261127]
permissions:
  contents: read
env:
  QA_SHA: c83bd9001cf2629dfb1934515fcf1c05ae553910
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged build inputs against the application pin
        run: |
          git merge-base --is-ancestor "$QA_SHA" HEAD
          git diff --exit-code "$QA_SHA" HEAD -- . ':(exclude)tests/**' ':(exclude)docs/**' ':(exclude).github/**'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          MINHDUC_PREVIEW_ORIGIN: https://minhduc-sprint2-approved-review.kenbinhoainam.chatgpt.site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - name: Validate static responses, layout and mock journeys
        env:
          QA_OUTPUT: ${{ runner.temp }}/minhduc-browser-results
        run: python tests/s2-pr-browser.py
      - name: Verify reviewer keyboard, iframe and resize behavior
        if: always()
        env:
          QA_OUTPUT: ${{ runner.temp }}/minhduc-browser-reviewer
        run: python tests/s2-browser-reviewer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint2-browser-reviewer
          path: ${{ runner.temp }}/minhduc-browser-reviewer/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint2-browser-evidence
          path: ${{ runner.temp }}/minhduc-browser-results/
          retention-days: 7

  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        locale: [vi, en, zh, ko, ja]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged build inputs against the application pin
        run: |
          git merge-base --is-ancestor "$QA_SHA" HEAD
          git diff --exit-code "$QA_SHA" HEAD -- . ':(exclude)tests/**' ':(exclude)docs/**' ':(exclude).github/**'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          MINHDUC_PREVIEW_ORIGIN: https://minhduc-sprint2-approved-review.kenbinhoainam.chatgpt.site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - name: Install pinned axe-core for injection into local documents
        run: npm install --prefix "$RUNNER_TEMP/s2-axe" --ignore-scripts --no-audit --no-fund --package-lock=false axe-core@4.10.3
      - name: Audit packaged routes at mobile and desktop widths
        env:
          QA_OUTPUT: ${{ runner.temp }}/minhduc-axe-${{ matrix.locale }}
          AXE_JS: ${{ runner.temp }}/s2-axe/node_modules/axe-core/axe.min.js
          QA_A11Y_LOCALES: ${{ matrix.locale }}
          QA_A11Y_WIDTHS: 390,1440
        run: python tests/s2-browser-a11y.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint2-axe-${{ matrix.locale }}
          path: ${{ runner.temp }}/minhduc-axe-${{ matrix.locale }}/
          retention-days: 7
